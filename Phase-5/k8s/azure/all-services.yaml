apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-backend
  labels:
    app: taskmaster
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmaster
      component: backend
  template:
    metadata:
      labels:
        app: taskmaster
        component: backend
    spec:
      containers:
      - name: backend
        image: taskmaster/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: taskmaster-secret
              key: DATABASE_URL
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: taskmaster-secret
              key: GROQ_API_KEY
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: taskmaster-secret
              key: BETTER_AUTH_SECRET
        - name: REDIS_URL
          value: redis://taskmaster-redis-master:6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-backend
  labels:
    app: taskmaster
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: taskmaster
    component: backend
---
