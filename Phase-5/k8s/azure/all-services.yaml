apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-notification-service
  labels:
    app: taskmaster
    component: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster
      component: notification
  template:
    metadata:
      labels:
        app: taskmaster
        component: notification
    spec:
      containers:
      - name: notification
        image: taskmaster/notification-service:latest
        env:
        - name: REDIS_URL
          value: redis://taskmaster-redis-master:6379
