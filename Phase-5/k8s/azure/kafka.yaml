apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: taskmaster-pubsub-config
spec:
  tracing:
    samplingRate: "1"
  pubsub:
    default:
      type: kubernetes
      topic: taskmaster-events
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: taskmaster-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "kafka:9092"
  - name: consumerGroup
    value: "taskmaster"
  - name: authRequired
    value: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-kafka
  labels:
    app: taskmaster
    component: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster
      component: kafka
  template:
    metadata:
      labels:
        app: taskmaster
        component: kafka
    spec:
      containers:
      - name: kafka
        image: bitnami/kafka:3
        ports:
        - containerPort: 9092
          name: kafka
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "taskmaster-zookeeper:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://taskmaster-kafka:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-kafka
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: kafka
  selector:
    app: taskmaster
    component: kafka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-zookeeper
  labels:
    app: taskmaster
    component: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster
      component: zookeeper
  template:
    metadata:
      labels:
        app: taskmaster
        component: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: bitnami/zookeeper:3
        ports:
        - containerPort: 2181
          name: zookeeper
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-zookeeper
spec:
  type: ClusterIP
  ports:
  - port: 2181
    targetPort: 2181
    protocol: TCP
    name: zookeeper
  selector:
    app: taskmaster
    component: zookeeper
