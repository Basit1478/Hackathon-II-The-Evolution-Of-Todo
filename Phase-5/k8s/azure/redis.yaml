apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-redis-master
  labels:
    app: taskmaster
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster
      component: redis
  template:
    metadata:
      labels:
        app: taskmaster
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-redis-master
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: taskmaster
    component: redis
