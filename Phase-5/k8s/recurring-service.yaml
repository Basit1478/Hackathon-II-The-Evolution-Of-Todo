apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurring-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recurring-service
  template:
    metadata:
      labels:
        app: recurring-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurring-service"
        dapr.io/app-port: "8001"
    spec:
      containers:
        - name: recurring-service
          image: recurring-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: BACKEND_URL
              value: "http://taskmaster-backend:8000"
            - name: PUBSUB_NAME
              value: "taskmaster-pubsub"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: recurring-service
spec:
  selector:
    app: recurring-service
  ports:
    - port: 8001
      targetPort: 8001
