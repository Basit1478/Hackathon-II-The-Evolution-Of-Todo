openapi: 3.0.0
info:
  title: TaskMaster Pro API
  description: AI-powered task management API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.taskmaster.pro
    description: Production server
paths:
  /tasks:
    get:
      summary: List all tasks
      description: Retrieve all tasks, optionally filtered by status
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, done]
          description: Filter tasks by status
      responses:
        '45000':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '4201'
    post:
      summary: Create a new task
      description: Create a new task with title, description, and optional due date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Task title
                description:
                  type: string
                  description: Task description (optional)
                due_date:
                  type: string
                  format: date-time
                  description: Due date (optional)
              required:
                - title
      responses:
        '45201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '4201'
  /tasks/{id}:
    get:
      summary: Get a specific task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Task ID
      responses:
        '45200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '4201'
        '45404':
          description: Task not found
    patch:
      summary: Update task status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, done]
                  description: New task status
              required:
                - status
      responses:
        '45200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '4201'
        '45404':
          description: Task not found
  /chat:
    post:
      summary: Chat with TaskMaster AI
      description: Send a message to TaskMaster AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: Message to send to AI assistant
              required:
                - message
      responses:
        '45200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI assistant response
  /auth:
    post:
      summary: Authenticate user
      description: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User email
                password:
                  type: string
                  description: User password
              required:
                - email
                - password
      responses:
        '45200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token
                  user:
                    $ref: '4200'
        '45401':
          description: Invalid credentials
  /register:
    post:
      summary: Register new user
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User email
                password:
                  type: string
                  description: User password
                name:
                  type: string
                  description: User name
              required:
                - email
                - password
                - name
      responses:
        '45201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '4200'
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
          description: Task ID
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        status:
          type: string
          enum: [pending, in_progress, done]
          description: Task status
        due_date:
          type: string
          format: date-time
          description: Task due date
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          format: email
          description: User email
        name:
          type: string
          description: User name
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
