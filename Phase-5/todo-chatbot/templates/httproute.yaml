{{- if .Values.httpRoute.enabled -}}
{{- $backendName := include "taskmaster.backend.fullname" . -}}
{{- $frontendName := include "taskmaster.frontend.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "taskmaster.fullname" . }}
  labels:
    {{- include "taskmaster.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ $backendName }}
          port: {{ .Values.backend.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $frontendName }}
          port: {{ .Values.frontend.service.port }}
{{- end }}
