apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "taskmaster.fullname" . }}-test-connection"
  labels:
    {{- include "taskmaster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-backend
      image: busybox
      command: ['wget']
      args: ['--spider', '-q', '{{ include "taskmaster.backend.fullname" . }}:{{ .Values.backend.service.port }}/health']
    - name: test-frontend
      image: busybox
      command: ['wget']
      args: ['--spider', '-q', '{{ include "taskmaster.frontend.fullname" . }}:{{ .Values.frontend.service.port }}']
  restartPolicy: Never
