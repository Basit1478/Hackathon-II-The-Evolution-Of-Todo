# Default values for TaskMaster Pro AI

# -- Backend Configuration
backend:
  replicaCount: 1
  image:
    repository: taskmaster-backend
    pullPolicy: Never
    tag: "latest"
  service:
    type: NodePort
    port: 8000
    nodePort: 30080
  env:
    DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/taskmaster"
    GROQ_API_KEY: "YOUR_GROQ_API_KEY"
    BETTER_AUTH_SECRET: "YOUR_BETTER_AUTH_SECRET"
    CORS_ORIGINS: '["http://localhost:3000","http://localhost:30081"]'
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Frontend Configuration
frontend:
  replicaCount: 1
  image:
    repository: taskmaster-frontend
    pullPolicy: Never
    tag: "latest"
  service:
    type: NodePort
    port: 3000
    nodePort: 30081
  env:
    NEXT_PUBLIC_API_URL: "http://localhost:8000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Common Configuration
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false

httpRoute:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
