apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster-frontend
  template:
    metadata:
      labels:
        app: taskmaster-frontend
    spec:
      containers:
        - name: frontend
          image: taskmaster-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:8000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-frontend
spec:
  type: NodePort
  selector:
    app: taskmaster-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
