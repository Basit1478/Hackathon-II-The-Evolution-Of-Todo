apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskmaster-backend
  template:
    metadata:
      labels:
        app: taskmaster-backend
    spec:
      containers:
        - name: backend
          image: taskmaster-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://user:pass@postgres:5432/taskmaster"
            - name: GROQ_API_KEY
              value: "<YOUR_GROQ_API_KEY>"
            - name: BETTER_AUTH_SECRET
              value: "<YOUR_AUTH_SECRET>"
            - name: CORS_ORIGINS
              value: '["*"]'
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-backend
spec:
  type: NodePort
  selector:
    app: taskmaster-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
