apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskmaster.backend.secretName" . }}
  labels:
    {{- include "taskmaster.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
